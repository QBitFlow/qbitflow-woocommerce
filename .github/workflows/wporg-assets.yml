# .github/workflows/wporg-assets.yml
name: Update WordPress.org readme & assets

on:
  push:
    branches: [ main ]        # or your default branch
    paths:
      - 'readme.txt'
      - '.wordpress-org/**'
  
# The SVN credentials are in this job: every action is pinned to a commit (the tag in the comment).
jobs:
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy readme + assets
        uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7 # 2.2.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: qbitflow-for-woocommerce