name: Deploy to WordPress.org

on:
  push:
    tags:
      - '*'

# The SVN credentials are in this job: every action is pinned to a commit (the tag in the comment).
jobs:
  tag:
    name: New tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # vendor-prefixed/ (the bundled QBitFlow SDK, namespace-prefixed by Strauss) is gitignored:
      # build.sh makes it, then stages the plugin as WordPress.org gets it (.distignore applied,
      # every shipped file linted). The release gate checks this same folder.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer

      - name: Build
        run: ./build.sh

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: qbitflow-for-woocommerce
          BUILD_DIR: build/qbitflow-for-woocommerce
